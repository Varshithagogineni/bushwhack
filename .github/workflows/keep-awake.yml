# Render's free plan sleeps after 15 idle minutes, and waking takes ~50 seconds.
# Pinging the health check every 10 minutes keeps the game instantly playable.
# Set the repo variable GAME_URL (e.g. https://bushwhack-xxxx.onrender.com) to enable it.
name: Keep game server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.GAME_URL != '' }}
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.GAME_URL }}/healthz"
